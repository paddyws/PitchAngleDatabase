<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galaxy PAnDa - Galaxy Pitch Angle Database</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body {
  background: #222;
  color: #fff;
  font-family: 'Segoe UI', Arial, sans-serif;
}

/* your existing styles unchanged */

.banner-header {
  position: relative;
  width: 100%;
  min-height: 260px;
  background: url('logo.png') center center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 0 0 24px 24px;
  margin-bottom: 24px;
}

.banner-header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, rgba(35,43,59,0.85), rgba(58,123,213,0.55));
}

.banner-content {
  position: relative;
  z-index: 2;
  text-align: center;
}

</style>
</head>

<body>

<div class="container-fluid">

<!-- Banner -->
<div class="banner-header">
  <div class="banner-content">
    <h1>Galaxy PAnDa</h1>
    <p class="lead">Galaxy Pitch Angle Database</p>
  </div>
</div>

<!-- ✅ Citation (subtle) -->
<p class="small text-secondary text-center mt-2">
  If you found Galaxy PAnDa useful in your research, please consider citing:
  <a href="https://doi.org/10.5281/zenodo.18568634" target="_blank">
    10.5281/zenodo.18568634
  </a>
</p>

<!-- your existing content stays here -->
<!-- (stats, table, filters, chart, etc) -->

<!-- ========================= -->
<!-- ✅ REPORT ISSUE FORM -->
<!-- ========================= -->

<div class="container my-5">
  <div class="p-4 rounded" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);">
    
    <h4 class="mb-2">Report an Issue</h4>
    <p class="text-secondary small mb-3">
      Found something off or have a question? Feel free to send a quick note.
    </p>

    <form id="contact-form" action="https://formspree.io/f/mnjwpjgg" method="POST">
      
      <input 
        type="email" 
        name="email" 
        class="form-control mb-2"
        placeholder="Your email (optional)"
      >

      <textarea 
        name="message" 
        rows="4" 
        class="form-control mb-3"
        placeholder="Describe the issue..."
        required
      ></textarea>

      <input type="hidden" name="_subject" value="Galaxy PAnDa Issue Report">

      <button type="submit" class="btn btn-outline-info">
        Send Message
      </button>

    </form>

    <p id="form-status" class="small mt-2 text-info"></p>

  </div>
</div>

</div> <!-- container-fluid -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

<!-- ✅ Formspree AJAX handling -->
<script>
const form = document.getElementById("contact-form");
const status = document.getElementById("form-status");

if (form) {
  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = new FormData(form);

    try {
      const response = await fetch(form.action, {
        method: form.method,
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        status.textContent = "Thanks — message received.";
        form.reset();
      } else {
        status.textContent = "Something went wrong. Try again.";
      }

    } catch (error) {
      status.textContent = "Network error. Try again.";
    }
  });
}
</script>

</body>
</html>
