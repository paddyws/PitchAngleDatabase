<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FIXED TITLE (no HTML tags) -->
<title>Galaxy PAnDa - Galaxy Pitch Angle Database</title>

<!-- Open Graph (link previews) -->
<meta property="og:title" content="Galaxy PAnDa - Pitch Angle Database">
<meta property="og:description" content="Explore spiral galaxy pitch angles, measurements, and references.">
<meta property="og:image" content="logo.png">
<meta property="og:type" content="website">

<!-- SEO description -->
<meta name="description" content="Galaxy PAnDa: A database of spiral galaxy pitch angles, measurements, and references.">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body {
    background: #222;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
}
table {
    width: 100%;
    background: #333;
    color: #fff;
    border-collapse: collapse;
    margin-top: 10px;
}
th, td {
    border: 1px solid #444;
    padding: 6px 8px;
    text-align: left;
}
th {
    background: #444;
    cursor: pointer;
}
tr:nth-child(even) {
    background: #2a2a2a;
}
input, select, button {
    margin: 4px;
    padding: 4px 8px;
}
.stat-card {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    margin-bottom: 20px;
}

/* Banner */
.banner-header {
    position: relative;
    width: 100%;
    min-height: 260px;
    background: url('logo.png') center center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0 0 24px 24px;
    margin-bottom: 24px;
}
.banner-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, rgba(35,43,59,0.85), rgba(58,123,213,0.55));
}
.banner-content {
    position: relative;
    z-index: 2;
    text-align: center;
}
.banner-content h1 {
    font-size: 3rem;
    font-weight: 900;
}
.banner-content p {
    font-size: 1.3rem;
    color: #b2ebf2;
}
</style>

</head>

<body>
<div class="container-fluid">

<!-- Banner -->
<div class="banner-header">
    <div class="banner-content">
        <h1>Galaxy PAnDa</h1>
        <p>Galaxy <b>P</b>itch <b>An</b>gle <b>Da</b>tabase</p>
    </div>
</div>

<!-- Stats -->
<div class="row mb-4">
    <div class="col-md-4">
        <div class="stat-card">
            <h3>Total Unique Galaxies</h3>
            <div id="totalGalaxies">-</div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="stat-card">
            <h3>Average Pitch Angle</h3>
            <div id="avgPitchAngle">-</div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="stat-card">
            <h3>Total Measurements</h3>
            <div id="totalMeasurements">-</div>
        </div>
    </div>
</div>

<!-- Search -->
<div class="row mb-3">
    <div class="col-md-6">
        <input type="text" id="searchInput" class="form-control" placeholder="Search galaxies...">
    </div>
</div>

<!-- Table -->
<div class="table-responsive">
    <table class="table" id="galaxyTable">
        <thead id="galaxyTableHead"></thead>
        <tbody id="galaxyTableBody"></tbody>
    </table>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js" defer></script>

</body>
</html>
