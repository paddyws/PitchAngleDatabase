<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Pitch Angle Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="script.js" defer></script>
    <style>
        body { background: #222; color: #fff; font-family: Arial, sans-serif; }
        table { width: 100%; background: #333; color: #fff; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #444; padding: 6px 8px; text-align: left; }
        th { background: #444; cursor: pointer; }
        tr:nth-child(even) { background: #2a2a2a; }
        input, select, button { margin: 4px; padding: 4px 8px; }
        #paginationControls button[disabled] { background: #555; color: #aaa; }
        #downloadControls { margin: 10px 0; }
        #paginationControls { margin: 10px 0; }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Add styles for checkbox groups */
        .checkbox-group {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
        }

        .checkbox-item {
            margin: 8px 0;
            display: flex;
            align-items: center;
        }

        .checkbox-item input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #4dd0e1;
        }

        .checkbox-item label {
            cursor: pointer;
            color: #ffffff;
            font-size: 0.9em;
        }

        .checkbox-item:hover label {
            color: #4dd0e1;
        }

        /* Style scrollbar for checkbox groups */
        .checkbox-group::-webkit-scrollbar {
            width: 8px;
        }

        .checkbox-group::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .checkbox-group::-webkit-scrollbar-thumb {
            background: rgba(77, 208, 225, 0.5);
            border-radius: 4px;
        }

        .checkbox-group::-webkit-scrollbar-thumb:hover {
            background: rgba(77, 208, 225, 0.7);
        }

        /* Style for check all/uncheck all buttons */
        .checkbox-controls {
            display: flex;
            gap: 8px;
        }

        .checkbox-controls .btn {
            padding: 2px 8px;
            font-size: 0.8em;
            border-color: #4dd0e1;
            color: #4dd0e1;
        }

        .checkbox-controls .btn:hover {
            background-color: #4dd0e1;
            color: #222;
        }

        /* Add filter section headers */
        #referenceFilterContainer::before,
        #bandFilterContainer::before,
        #methodFilterContainer::before,
        #ImageSourceFilterContainer::before {
            content: attr(data-title);
            display: block;
            color: #4dd0e1;
            font-weight: bold;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <header class="text-center py-4">
            <h1>Galaxy Pitch Angle Analysis</h1>
            <p class="lead">Explore and analyze galaxy data</p>
            <div class="file-upload-container mb-3">
                <label for="fileInput" class="btn btn-primary">
                    Load Galaxy Database
                    <input type="file" id="fileInput" accept=".xlsx" style="display: none;">
                </label>
                <p id="fileName" class="mt-2"></p>
            </div>
        </header>

        <!-- Statistics Cards -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="stat-card">
                    <h3>Total Unique Galaxies</h3>
                    <div id="totalGalaxies" class="stat-value">-</div>
                    <div id="filteredTotalGalaxies" class="stat-subvalue text-info"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <h3>Average Pitch Angle</h3>
                    <div id="avgPitchAngle" class="stat-value">-</div>
                    <div id="filteredAvgPitchAngle" class="stat-subvalue text-info"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <h3>Total Measurements</h3>
                    <div id="totalMeasurements" class="stat-value">-</div>
                    <div id="filteredTotalMeasurements" class="stat-subvalue text-info"></div>
                </div>
            </div>
        </div>

        <!-- Search and Sort -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="search-container">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search by galaxy name or position...">
                </div>
            </div>
            <div class="col-md-6">
                <div class="sort-container">
                    <select id="sortSelect" class="form-select">
                        <option value="">Sort by...</option>
                        <option value="PA_degree">Pitch Angle</option>
                        <option value="Galaxy_name">Galaxy Name</option>
                        <option value="Band">Band</option>
                        <option value="Method">Method</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Filter Row: Reference, Band, Method, ImageSource -->
        <div class="row mb-2">
            <div class="col-md-3" id="referenceFilterContainer" data-title="Filter by Reference"></div>
            <div class="col-md-3" id="bandFilterContainer" data-title="Filter by Band"></div>
            <div class="col-md-3" id="methodFilterContainer" data-title="Filter by Method"></div>
            <div class="col-md-3" id="ImageSourceFilterContainer" data-title="Filter by ImageSource"></div>
        </div>
        <!-- Download Buttons Row -->
        <div class="row mb-2">
            <div class="col-md-12 text-end">
                <button id="downloadAllBtn" class="btn btn-success">Download All Data as CSV</button>
                <button id="downloadFilteredBtn" class="btn btn-info">Download Filtered Data as CSV</button>
            </div>
        </div>

        <!-- Data Table -->
        <div class="table-responsive">
            <table class="table table-hover" id="galaxyTable">
                <thead id="galaxyTableHead">
                    <tr>
                        <th>ID</th>
                        <th>Galaxy Name</th>
                        <th>J2000 Position</th>
                        <th>Pitch Angle (°)</th>
                        <th>PA Error (°)</th>
                        <th>Reference</th>
                        <th>DOI</th>
                        <th>Method</th>
                        <th>Band</th>
                        <th>ImageSource</th>
                        <th>Arm or Wh</th>
                    </tr>
                </thead>
                <tbody id="galaxyTableBody">
                    <!-- Data will be populated here -->
                </tbody>
            </table>
        </div>

        <!-- Pitch Angle Distribution Chart -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="chart-container">
                    <h3>Pitch Angle Distribution</h3>
                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="chartFilteredToggle">
                        <label class="form-check-label" for="chartFilteredToggle">Show chart for filtered data only</label>
                    </div>
                    <canvas id="pitchAngleChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Only one script.js include, defered -->
    <script src="script.js" defer></script>
</body>
</html>
